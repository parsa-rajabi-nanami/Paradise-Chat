<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1a4a8d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <script>
    try {
      const savedTheme = localStorage.getItem('theme');
      const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      
      if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    } catch (_) {}
  </script>

  <!-- Favicon & Icons -->
  <link rel="icon" type="image/svg+xml" href="/chat.svg" />
  <link rel="apple-touch-icon" href="/chat.svg" />

  <!-- SEO -->
  <meta name="robots" content="index, follow" />
  <title>ParadiseChat - RealTime Messaging</title>
  <meta name="description"
    content="ParadiseChat is a fast and secure real-time messaging platform for private chats, group conversations, and seamless communication across devices." />
  <meta name="keywords"
    content="chat app, realtime messaging, secure chat, websocket chat, online messaging, group chat, instant messaging, ParadiseChat" />

  <!-- Open Graph -->
  <meta property="og:title" content="ParadiseChat - RealTime Messaging" />
  <meta property="og:description" content="Fast and secure real-time messaging platform." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/preview.png" />
  <meta property="og:url" content="/" />

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ParadiseChat - RealTime Messaging" />
  <meta name="twitter:description" content="Fast and secure real-time messaging platform." />
  <meta name="twitter:image" content="/preview.png" />

  <!-- Canonical URL -->
  <link rel="canonical" href="%VITE_SITE_URL%/" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
