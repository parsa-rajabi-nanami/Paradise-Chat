<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="theme-color" content="#1a4a8d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- icon -->
  <link rel="icon" type="image/svg+xml" href="/chat.svg" />
  <link rel="apple-touch-icon" href="/chat.svg" />

  <!-- SEO -->
  <meta name="robots" content="index, follow" />
  <title>ParadiseChat - RealTime Messaging</title>
  <meta name="description"
    content="ParadiseChat is a fast and secure real-time messaging platform for private chats, group conversations, and seamless communication across devices." />
  <meta name="keywords"
    content="chat app, realtime messaging, secure chat, websocket chat, online messaging, group chat, instant messaging, ParadiseChat" />

  <!-- Open Graph -->
  <meta property="og:title" content="ParadiseChat" />
  <meta property="og:description" content="Fast and secure real-time messaging platform." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="%VITE_SITE_URL%/preview.png" />
  <meta property="og:url" content="%VITE_SITE_URL%" />

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ParadiseChat" />
  <meta name="twitter:description" content="Fast and secure real-time messaging platform." />
  <meta name="twitter:image" content="%VITE_SITE_URL%/preview.png" />

  <!-- Canonical URL -->
  <link rel="canonical" href="%VITE_SITE_URL%" />
</head>

<body>
  <div id="root"></div>
  <script>
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.classList.toggle(
      'dark',
      savedTheme === 'dark'
    );
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
