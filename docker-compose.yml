services:
  db:
    image: postgres:16-alpine
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:6379:6379"
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      # Keep builds and bind mounts anchored to the canonical checkout. This
      # prevents running Compose from a deleted/recycle-bin copy by accident.
      context: ${PROJECT_ROOT:-/www/wwwroot/paradise-chat}
      dockerfile: backend/Dockerfile
    environment:
      DJANGO_ENV: production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      DJANGO_BASE_URL: ${DJANGO_BASE_URL:-http://localhost}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
      LOGIN_THROTTLE_RATE: ${LOGIN_THROTTLE_RATE:-10/minute}
      REGISTER_THROTTLE_RATE: ${REGISTER_THROTTLE_RATE:-5/hour}
      WS_RATE_LIMIT_WINDOW_SECONDS: ${WS_RATE_LIMIT_WINDOW_SECONDS:-10}
      WS_RATE_LIMIT_MESSAGES: ${WS_RATE_LIMIT_MESSAGES:-30}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - media_data:/app/media
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      gunicorn chat_project.asgi:application -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000 --workers $${WEB_CONCURRENCY:-2}
      --access-logfile - --error-logfile -"

  frontend:
    build:
      context: ${PROJECT_ROOT:-/www/wwwroot/paradise-chat}
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost/api}
        VITE_WS_HOST: ${VITE_WS_HOST:-localhost}
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost}
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - type: bind
        source: ${PROJECT_ROOT:-/www/wwwroot/paradise-chat}/deploy/nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
