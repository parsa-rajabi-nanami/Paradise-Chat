name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pip-audit
      - run: black --check .
      - run: flake8 .
      - run: python -m pytest
      - run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: VITE_SITE_URL=http://localhost npm run build
      - run: npm audit --audit-level=high

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f backend/Dockerfile .
      - run: docker build -f frontend/Dockerfile --build-arg VITE_API_URL=http://localhost/api --build-arg VITE_WS_HOST=localhost --build-arg VITE_SITE_URL=http://localhost .
